services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ecommerce_db
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_root_local_only}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-change_root_local_only}"]
      interval: 10s
      timeout: 5s
      retries: 10
  api:
    build: .
    restart: unless-stopped
    environment:
      APP_NAME: ECommerce Order Management API
      DATABASE_URL: mysql+pymysql://ecommerce_user:${MYSQL_PASSWORD:-change_me_local_only}@db:3306/ecommerce_db
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      RATE_LIMIT_DEFAULT: 100/minute
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  mysql_data:
